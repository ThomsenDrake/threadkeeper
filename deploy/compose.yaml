name: threadkeeper

x-application: &application
  image: threadkeeper:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &application-environment
    DATABASE_URL: postgresql://threadkeeper:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/threadkeeper
    HOST: 0.0.0.0
    PORT: "3000"
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL in .env}
    BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
    MODEL_ID: ${MODEL_ID:-nvidia/Nemotron-3_5-Lightning}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-60000}
    MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-4096}
    MODEL_JSON_OBJECT: ${MODEL_JSON_OBJECT:-true}
    MODEL_STRUCTURED_OUTPUT: ${MODEL_STRUCTURED_OUTPUT:-false}
    MODEL_MAX_EVENTS: ${MODEL_MAX_EVENTS:-32}
    MODEL_MAX_SOURCE_CHARACTERS: ${MODEL_MAX_SOURCE_CHARACTERS:-64000}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
    EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-60000}
    WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: threadkeeper
      POSTGRES_USER: threadkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadkeeper -d threadkeeper"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    <<: *application
    command: ["pnpm", "api"]
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/health',{headers:{Host:new URL(process.env.APP_ORIGIN||'http://localhost:3000').host}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *application
    command: ["pnpm", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
